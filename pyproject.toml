[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strattester"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["requests>=2.31,<3", "psutil>=5.9,<8"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

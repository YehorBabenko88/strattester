name: Gateway synthetic research component
on:
  pull_request:
    paths: ['strattester/research/gateway_adapter.py', 'tests/gateway_adapter/**', 'docs/gateway/research/**', '.github/workflows/gateway-research.yml']
  push:
    branches: [agent7/gateway-synthetic-research-20261107]
permissions:
  contents: read
jobs:
  finite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_NO_REPLACE_OBJECTS: '1'
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: core.eol
      GIT_CONFIG_VALUE_1: lf
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Exact source and actual Meta calculation and existing financial regressions
        shell: python -I -S -B {0}
        run: |
          import hashlib,io,importlib.util,json,os,pathlib,subprocess,sys,unittest
          root=pathlib.Path.cwd()
          git=pathlib.Path('C:/Program Files/Git/cmd/git.exe' if sys.platform=='win32' else '/usr/bin/git')
          git_env={k:v for k,v in os.environ.items() if not k.upper().startswith('GIT_')}
          git_env.update(GIT_CONFIG_NOSYSTEM='1',GIT_CONFIG_GLOBAL=os.devnull)
          def g(*args,data=None):
              return subprocess.check_output([str(git),'--no-replace-objects','--no-optional-locks','-c','core.fsmonitor=false','-c','core.hooksPath='+os.devnull,*args],cwd=root,env=git_env,input=data)
          assert sys.flags.isolated and sys.flags.no_site and sys.dont_write_bytecode and sys.pycache_prefix is None
          assert g('rev-parse','HEAD').decode().strip()==os.environ['EXPECTED_HEAD']
          def receipt():
              assert not os.environ.get('GIT_REPLACE_REF_BASE')
              assert not g('for-each-ref','refs/replace','--format=%(refname)').strip()
              assert not root.is_symlink() and not (getattr(root.lstat(),'st_file_attributes',0)&1024)
              entries=[]
              for row in g('ls-tree','-rz','--full-tree','HEAD').split(b'\0'):
                  if not row: continue
                  meta,name=row.split(b'\t',1);mode,kind,oid=meta.split()
                  assert mode in (b'100644',b'100755') and kind==b'blob'
                  entries.append((name.decode(),oid.decode()))
              raw=g('cat-file','--batch',data=''.join(oid+'\n' for _,oid in entries).encode())
              stream=io.BytesIO(raw);result={}
              for name,oid in entries:
                  actual,kind,size=stream.readline().split();data=stream.read(int(size))
                  assert actual.decode()==oid and kind==b'blob' and stream.read(1)==b'\n'
                  assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==oid
                  path=root/name;info=path.lstat()
                  assert path.is_file() and not path.is_symlink() and info.st_nlink==1 and not (getattr(info,'st_file_attributes',0)&1024)
                  assert path.read_bytes()==data and path.suffix not in ('.pyc','.pyo')
                  result[name]=hashlib.sha256(data).hexdigest()
              for path in root.rglob('*'):
                  rel=path.relative_to(root)
                  if rel.parts[0]=='.git': continue
                  assert not path.is_symlink() and not (getattr(path.lstat(),'st_file_attributes',0)&1024)
                  if path.is_file(): assert rel.as_posix() in result and path.suffix not in ('.pyc','.pyo')
              return result
          before=receipt()
          meta=pathlib.Path(os.environ['RUNNER_TEMP'])/'gateway-meta-source-f3c'
          meta.mkdir()
          def mg(*args):
              return subprocess.check_output([str(git),'--no-replace-objects','--no-optional-locks','-c','core.fsmonitor=false','-c','core.hooksPath='+os.devnull,'-c','core.autocrlf=false','-c','core.eol=lf','-c','init.templateDir=',*args],cwd=meta,env=git_env)
          mg('init','--quiet')
          mg('fetch','--quiet','--depth=1','https://github.com/YehorBabenko88/meta_analyse.git','f3c01a23fa5baaeeeb28eb8e9397e72b5ef4d5a1')
          mg('checkout','--quiet','--detach','FETCH_HEAD')
          assert mg('rev-parse','HEAD').decode().strip()=='f3c01a23fa5baaeeeb28eb8e9397e72b5ef4d5a1'
          assert mg('rev-parse','HEAD^{tree}').decode().strip()=='c155c935a801fa98b7c78219c9798ce1f1be8848'
          os.environ['GATEWAY_META_SOURCE_ROOT']=str(meta)
          os.environ['GATEWAY_FIXTURE_SOURCE_REVISION']=os.environ['EXPECTED_HEAD']
          sys.path.insert(0,str(root))
          suite=unittest.defaultTestLoader.discover(str(root/'tests/gateway_adapter'),pattern='test_*.py')
          suite.addTests(unittest.defaultTestLoader.discover(str(root/'contracts/agent7-financial-boundary'),pattern='test_adapter.py'))
          ids=[]
          def collect(suite):
              for item in suite:
                  if isinstance(item,unittest.TestSuite): collect(item)
                  else: ids.append(item.id())
          collect(suite)
          expected_ids=["test_adapter.BoundaryTests.test_already_net_no_double_cost","test_adapter.BoundaryTests.test_ascii_code_boundaries","test_adapter.BoundaryTests.test_empty_objects_refused","test_adapter.BoundaryTests.test_explicit_v2_only_and_distinct_profile_case","test_adapter.BoundaryTests.test_float_and_nonfinite_refused","test_adapter.BoundaryTests.test_gross_costs_once","test_adapter.BoundaryTests.test_large_exact_arithmetic","test_adapter.BoundaryTests.test_malformed_admission_container_refused","test_adapter.BoundaryTests.test_missing_currency_or_units","test_adapter.BoundaryTests.test_missing_provenance_and_bad_pin_refused","test_adapter.BoundaryTests.test_negative_fees_and_unit_mismatch_refused","test_adapter.BoundaryTests.test_negative_funding_is_credit","test_adapter.BoundaryTests.test_no_mutation_and_determinism","test_adapter.BoundaryTests.test_profile_digest_mismatch","test_adapter.BoundaryTests.test_result_overflow_refused","test_adapter.BoundaryTests.test_scale_endpoints","test_adapter.BoundaryTests.test_unknown_basis_and_fields_refused","test_adapter.BoundaryTests.test_unknown_profile_schema_refused","test_adapter.BoundaryTests.test_unqualified_profile_refused","test_adapter.BoundaryTests.test_wrong_scale_and_negative_slippage_refused","test_gateway_adapter.ExistingMetaReferenceTests.test_real_meta_hand_calculated_btc_levels","test_gateway_adapter.ExistingMetaReferenceTests.test_real_meta_repeat_exact_bytes","test_gateway_adapter.GatewayAdapterTests.test_actual_result_equals_real_meta_and_provenance","test_gateway_adapter.GatewayAdapterTests.test_cancel_after_real_meta_call_discards_result","test_gateway_adapter.GatewayAdapterTests.test_cancel_before_calculation_returns_no_result","test_gateway_adapter.GatewayAdapterTests.test_cancel_hook_requires_exact_bool_and_no_awaitable","test_gateway_adapter.GatewayAdapterTests.test_dataset_digest_mismatch_refused","test_gateway_adapter.GatewayAdapterTests.test_duplicate_json_keys_refused","test_gateway_adapter.GatewayAdapterTests.test_finite_and_shape_bounds_refused","test_gateway_adapter.GatewayAdapterTests.test_foreign_suspended_coroutine_not_finalized_by_refusal","test_gateway_adapter.GatewayAdapterTests.test_non_synthetic_refused_even_resealed","test_gateway_adapter.GatewayAdapterTests.test_preloaded_meta_namespace_refused","test_gateway_adapter.GatewayAdapterTests.test_replay_same_bytes_clock_and_input_unchanged","test_gateway_adapter.GatewayAdapterTests.test_request_and_row_budget_refused","test_gateway_adapter.GatewayAdapterTests.test_schema_operation_unknown_fields_refused","test_gateway_adapter.GatewayAdapterTests.test_source_cache_and_shadow_refused","test_gateway_adapter.GatewayAdapterTests.test_source_changed_after_calculation_refused","test_gateway_adapter.GatewayAdapterTests.test_source_pin_mismatch_refused"]
          assert sorted(ids)==expected_ids and len(ids)==len(set(ids))==38
          assert pathlib.Path(sys.modules['test_adapter'].__file__).resolve()==root/'contracts/agent7-financial-boundary/test_adapter.py'
          assert sys.modules['test_adapter'].ROOT==root/'contracts/agent7-financial-boundary'
          assert pathlib.Path(sys.modules['test_gateway_adapter'].__file__).resolve()==root/'tests/gateway_adapter/test_gateway_adapter.py'
          assert pathlib.Path(sys.modules['support'].__file__).resolve()==root/'tests/gateway_adapter/support.py'
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful() and result.testsRun==38 and not result.skipped
          recipe_spec=importlib.util.spec_from_file_location('_gateway_evidence_recipe',root/'tests/gateway_adapter/generate_evidence.py')
          recipe=importlib.util.module_from_spec(recipe_spec);recipe_spec.loader.exec_module(recipe)
          evidence_dir=pathlib.Path(os.environ['RUNNER_TEMP'])/'gateway-research-computation'
          actual_receipt=recipe.generate(evidence_dir)
          adapter=sys.modules['support'].load_adapter()
          sample=root/'docs/gateway/research/evidence/btc-v1'
          replay=adapter.execute_synthetic_research((sample/'request.json').read_bytes(),meta_source_root=str(meta),cancel_check=lambda:False)
          assert replay['artifact_bytes']==(sample/'meta-result.json').read_bytes()
          assert sys.modules['support'].canonical(replay['descriptor'])==(sample/'descriptor.json').read_bytes()
          assert before==receipt()
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'gateway-research-component-evidence.json'
          out.write_text(json.dumps({'head':os.environ['EXPECTED_HEAD'],'tree':g('rev-parse','HEAD^{tree}').decode().strip(),'tests':ids,'skips':0,'source_sha256':before,'qualification':'DISPOSABLE_SYNTHETIC_RESEARCH_COMPONENT_ONLY','source_authenticity':'NOT_EVALUATED','native_admission':False,'physical_admission':False,'strategy_profitability_proven':False,'meta_head':actual_receipt['meta_head'],'meta_tree':actual_receipt['meta_tree'],'meta_source_sha256':actual_receipt['meta_source_sha256'],'actual_computation_files':actual_receipt['files'],'published_fixture_replay':'BYTE_IDENTICAL','publication':'NONE'},indent=2)+'\n',encoding='utf-8')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gateway-research-component-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/gateway-research-component-evidence.json
            ${{ runner.temp }}/gateway-research-computation/*.json
          if-no-files-found: error

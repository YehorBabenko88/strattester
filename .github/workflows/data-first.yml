name: data-first-scheduler
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: data-first-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source-regression:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade 'pip>=26.2.2,<27' 'setuptools>=84.1,<85'
      - run: python -m pip install -e '.[dev,postgres]'
      - name: Synthetic clients and disposable SQLite only
        run: python -m pytest tests/engine tests/marketdata tests/strategies tests/persistence tests/research/test_runner.py -q --junitxml=results/data-first/tests.xml --json-report --json-report-file=results/data-first/tests.json
      - name: Exact source and dependency provenance
        shell: python
        run: |
          import hashlib, importlib.metadata, json, pathlib, platform, subprocess, sys
          out=pathlib.Path('results/data-first');out.mkdir(parents=True,exist_ok=True)
          head=subprocess.check_output(['git','--no-replace-objects','rev-parse','HEAD'],text=True).strip()
          tree=subprocess.check_output(['git','--no-replace-objects','rev-parse','HEAD^{tree}'],text=True).strip()
          tests=json.loads((out/'tests.json').read_text())
          nodes=[t['nodeid'] for t in tests['tests']]
          assert len(nodes)==len(set(nodes)) and tests['exitcode']==0
          record={'head':head,'tree':tree,'os':platform.platform(),'python':sys.version,'summary':tests['summary'],'nodeids':nodes,'dependencies':{d.metadata['Name']:d.version for d in importlib.metadata.distributions()},'actual_bybit_network':'NOT_EXECUTED','physical_g1':'NOT_AUTHORIZED','trading':'NO-GO'}
          (out/'provenance.json').write_text(json.dumps(record,indent=2))
          (out/'SHA256SUMS.json').write_text(json.dumps({p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in out.iterdir() if p.is_file()},indent=2))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: data-first-${{ matrix.os }}-${{ matrix.python }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: results/data-first/
          if-no-files-found: error

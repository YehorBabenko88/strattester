name: mathematical-contract-reference
on:
  pull_request:
    paths:
      - 'research/math_contract_reference.py'
      - 'research/test_math_contract_reference.py'
      - '.github/workflows/mathematical-contract-reference.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile reference and tests before execution
        run: python -m py_compile research/math_contract_reference.py research/test_math_contract_reference.py
      - name: Run independent standard-library contract tests
        run: python -m unittest discover -s research -p 'test_math_contract_reference.py' -v

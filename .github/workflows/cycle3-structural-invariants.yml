name: cycle3-structural-invariants
on:
  pull_request:
    paths:
      - 'tests/research/test_cycle3_structural_invariants.py'
      - 'tests/research/test_cycle3_cpu_contract.py'
      - 'tests/research/test_cycle3_operator_connectivity.py'
      - '.github/workflows/cycle3-structural-invariants.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install pytest pytest-json-report
      - name: Required structural invariants
        run: python -m pytest -q -o addopts='' tests/research/test_cycle3_structural_invariants.py tests/research/test_cycle3_cpu_contract.py tests/research/test_cycle3_operator_connectivity.py --json-report --json-report-file=cycle3-results.json
      - name: Enforce exact tests, zero skip, zero deselection
        run: |
          python -c "import json; d=json.load(open('cycle3-results.json')); s=d['summary']; assert s['passed']==19 and s['total']==19; assert all(s.get(k,0)==0 for k in ('failed','error','skipped','xfailed','xpassed','deselected')); assert len([t for t in d['tests'] if t.get('outcome')=='passed'])==19"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cycle3-structural-invariants
          path: cycle3-results.json
          if-no-files-found: error

name: cycle3-structural-invariants
on:
  pull_request:
    paths:
      - 'tests/research/test_cycle3_structural_invariants.py'
      - 'tests/research/test_cycle3_cpu_contract.py'
      - 'tests/research/test_cycle3_operator_connectivity.py'
      - 'tests/research/test_cycle3_forecast_contract.py'
      - 'tests/research/test_cycle3_resource_admission.py'
      - 'tests/research/test_cycle3_gradient_oracle.py'
      - '.github/workflows/cycle3-structural-invariants.yml'
      - 'scripts/cycle3_structural_report_gate.py'
      - 'tests/research/test_cycle3_report_gate.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install pytest pytest-json-report
      - name: Required structural invariants
        run: python -m pytest -q -o addopts='' tests/research/test_cycle3_structural_invariants.py tests/research/test_cycle3_cpu_contract.py tests/research/test_cycle3_operator_connectivity.py tests/research/test_cycle3_forecast_contract.py tests/research/test_cycle3_resource_admission.py tests/research/test_cycle3_gradient_oracle.py --json-report --json-report-file=cycle3-results.json
      - name: Enforce exact tests, zero skip, zero deselection
        run: |
          python scripts/cycle3_structural_report_gate.py cycle3-results.json
      - name: Test report verifier fail-closed semantics
        run: python -m unittest discover -s tests/research -p test_cycle3_report_gate.py -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cycle3-structural-invariants
          path: cycle3-results.json
          if-no-files-found: error

name: alphafold-research-cpu

on:
  pull_request:
    paths:
      - 'strattester/research/alphafold_*.py'
      - 'tests/research/test_alphafold_*.py'
      - '.github/workflows/alphafold-research-cpu.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-operators:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: ""
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch and test dependencies
        run: |
          python -m pip install --disable-pip-version-check 'torch>=2.3,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check pytest
      - name: Assert PyTorch is importable
        run: python -c "import torch; assert not torch.cuda.is_available(); print(torch.__version__)"
      - name: Run required structural tests (no skips)
        run: |
          python -m pytest -q -rs --strict-markers \
            tests/research/test_alphafold_triangle.py \
            tests/research/test_alphafold_triangle_reference.py \
            tests/research/test_alphafold_triangle_attention.py \
            tests/research/test_alphafold_triangle_attention_oracle.py \
            tests/research/test_alphafold_pair_stack.py \
            tests/research/test_alphafold_pair_stack_budget.py \
            -k 'not gpu and not cuda' -o addopts=''

name: cycle4-upstream-triangle
on:
  pull_request:
    paths:
      - 'tests/research/test_cycle4_upstream_triangle_oracle.py'
      - '.github/workflows/cycle4-upstream-triangle.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install pytest pytest-json-report
      - name: Pinned-upstream differential
        run: python -m pytest -q -o addopts='' tests/research/test_cycle4_upstream_triangle_oracle.py --json-report --json-report-file=cycle4-report.json
      - name: Strict seven-case accounting
        run: |
          python -c "import json; d=json.load(open('cycle4-report.json')); s=d['summary']; assert s.get('passed')==7 and s.get('total')==7; assert not any(s.get(k,0) for k in ('failed','error','skipped','xfailed','xpassed','deselected')); assert len({t['nodeid'] for t in d['tests'] if t['outcome']=='passed'})==7"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cycle4-upstream-triangle
          path: cycle4-report.json
          if-no-files-found: error

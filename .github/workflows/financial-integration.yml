name: financial-integration
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: financial-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native-components:
    uses: ./.github/workflows/windows-native-components.yml
  engineering:
    name: ${{ matrix.gate }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        gate: [core, data, math, cpu, training, security, integration]
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade 'pip>=26.2.2,<27' 'setuptools>=84.1,<85'
      - run: python -m pip install -e '.[dev,postgres]' pytest-json-report
      - run: python -m pip install 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Run exact-node fail-closed gate
        run: python scripts/financial_gate.py --gate '${{ matrix.gate }}' --sha '${{ github.event.pull_request.head.sha || github.sha }}' --output results/financial-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: financial-${{ matrix.gate }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: results/financial-ci/
          if-no-files-found: error
  acceptance:
    name: system-acceptance-NO-GO
    if: always()
    needs: [engineering, native-components]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: financial-*-${{ github.event.pull_request.head.sha || github.sha }}
          path: results/financial-ci
          merge-multiple: true
      - name: Aggregate mandatory execution and external blockers
        env:
          ENGINEERING_RESULT: ${{ needs.engineering.result }}
          NATIVE_RESULT: ${{ needs.native-components.result }}
        run: python scripts/financial_gate.py --gate aggregate --sha '${{ github.event.pull_request.head.sha || github.sha }}' --output results/financial-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: financial-acceptance-${{ github.event.pull_request.head.sha || github.sha }}
          path: results/financial-ci/acceptance.json
          if-no-files-found: error

name: Agent7 financial boundary component
on:
  pull_request:
    paths: ['contracts/agent7-financial-boundary/**', '.github/workflows/agent7-financial-boundary.yml']
  push:
    branches: [agent7/financial-calculation-boundary-20261107]
permissions:
  contents: read
jobs:
  finite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_NO_REPLACE_OBJECTS: '1'
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: core.eol
      GIT_CONFIG_VALUE_1: lf
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Exact source and twenty mandatory DTO regressions
        shell: python -I -S -B {0}
        run: |
          import hashlib,io,json,os,pathlib,subprocess,sys,unittest
          root=pathlib.Path.cwd()
          git=pathlib.Path('C:/Program Files/Git/cmd/git.exe' if sys.platform=='win32' else '/usr/bin/git')
          git_env={k:v for k,v in os.environ.items() if not k.upper().startswith('GIT_')}
          git_env.update(GIT_CONFIG_NOSYSTEM='1',GIT_CONFIG_GLOBAL=os.devnull)
          def g(*args,data=None):
              return subprocess.check_output([str(git),'--no-replace-objects','--no-optional-locks','-c','core.fsmonitor=false','-c','core.hooksPath='+os.devnull,*args],cwd=root,env=git_env,input=data)
          assert sys.flags.isolated and sys.flags.no_site and sys.dont_write_bytecode and sys.pycache_prefix is None
          assert g('rev-parse','HEAD').decode().strip()==os.environ['EXPECTED_HEAD']
          def receipt():
              assert not os.environ.get('GIT_REPLACE_REF_BASE')
              assert not g('for-each-ref','refs/replace','--format=%(refname)').strip()
              assert not root.is_symlink() and not (getattr(root.lstat(),'st_file_attributes',0)&1024)
              entries=[]
              for row in g('ls-tree','-rz','--full-tree','HEAD').split(b'\0'):
                  if not row: continue
                  meta,name=row.split(b'\t',1);mode,kind,oid=meta.split()
                  assert mode in (b'100644',b'100755') and kind==b'blob'
                  entries.append((name.decode(),oid.decode()))
              raw=g('cat-file','--batch',data=''.join(oid+'\n' for _,oid in entries).encode())
              stream=io.BytesIO(raw);result={}
              for name,oid in entries:
                  actual,kind,size=stream.readline().split();data=stream.read(int(size))
                  assert actual.decode()==oid and kind==b'blob' and stream.read(1)==b'\n'
                  assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==oid
                  path=root/name;info=path.lstat()
                  assert path.is_file() and not path.is_symlink() and info.st_nlink==1 and not (getattr(info,'st_file_attributes',0)&1024)
                  assert path.read_bytes()==data and path.suffix not in ('.pyc','.pyo')
                  result[name]=hashlib.sha256(data).hexdigest()
              for path in root.rglob('*'):
                  rel=path.relative_to(root)
                  if rel.parts[0]=='.git': continue
                  assert not path.is_symlink() and not (getattr(path.lstat(),'st_file_attributes',0)&1024)
                  if path.is_file(): assert rel.as_posix() in result and path.suffix not in ('.pyc','.pyo')
              return result
          before=receipt()
          sys.path.insert(0,str(root))
          suite=unittest.defaultTestLoader.discover(str(root/'contracts/agent7-financial-boundary'),pattern='test_adapter.py')
          ids=[]
          def collect(suite):
              for item in suite:
                  if isinstance(item,unittest.TestSuite): collect(item)
                  else: ids.append(item.id())
          collect(suite)
          expected_ids=["test_adapter.BoundaryTests.test_already_net_no_double_cost","test_adapter.BoundaryTests.test_ascii_code_boundaries","test_adapter.BoundaryTests.test_empty_objects_refused","test_adapter.BoundaryTests.test_explicit_v2_only_and_distinct_profile_case","test_adapter.BoundaryTests.test_float_and_nonfinite_refused","test_adapter.BoundaryTests.test_gross_costs_once","test_adapter.BoundaryTests.test_large_exact_arithmetic","test_adapter.BoundaryTests.test_malformed_admission_container_refused","test_adapter.BoundaryTests.test_missing_currency_or_units","test_adapter.BoundaryTests.test_missing_provenance_and_bad_pin_refused","test_adapter.BoundaryTests.test_negative_fees_and_unit_mismatch_refused","test_adapter.BoundaryTests.test_negative_funding_is_credit","test_adapter.BoundaryTests.test_no_mutation_and_determinism","test_adapter.BoundaryTests.test_profile_digest_mismatch","test_adapter.BoundaryTests.test_result_overflow_refused","test_adapter.BoundaryTests.test_scale_endpoints","test_adapter.BoundaryTests.test_unknown_basis_and_fields_refused","test_adapter.BoundaryTests.test_unknown_profile_schema_refused","test_adapter.BoundaryTests.test_unqualified_profile_refused","test_adapter.BoundaryTests.test_wrong_scale_and_negative_slippage_refused"]
          assert sorted(ids)==expected_ids and len(ids)==len(set(ids))==20
          assert pathlib.Path(sys.modules['test_adapter'].__file__).resolve()==root/'contracts/agent7-financial-boundary/test_adapter.py'
          assert sys.modules['test_adapter'].ROOT==root/'contracts/agent7-financial-boundary'
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful() and result.testsRun==20 and not result.skipped
          assert before==receipt()
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'financial-boundary-component-evidence.json'
          out.write_text(json.dumps({'head':os.environ['EXPECTED_HEAD'],'tree':g('rev-parse','HEAD^{tree}').decode().strip(),'tests':ids,'skips':0,'source_sha256':before,'qualification':'SYNTHETIC_DTO_COMPONENT_ONLY','source_authenticity':'NOT_EVALUATED','native_admission':False,'physical_admission':False,'strategy_profitability_proven':False},indent=2)+'\n',encoding='utf-8')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: financial-boundary-component-${{ matrix.os }}
          path: ${{ runner.temp }}/financial-boundary-component-evidence.json
          if-no-files-found: error

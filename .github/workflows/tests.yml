name: tests
on:
  push:
    branches-ignore: ['integration/alphafold-financial-system']
  pull_request:
concurrency:
  group: core-${{ github.head_ref || github.ref_name }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11','3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Checkout pinned shared owner source fence
        uses: actions/checkout@v4
        with:
          repository: YehorBabenko88/unified-system
          ref: e0c2ea20aa4f1bd9476d1046e7e4b41f1b12d8e9
          path: .source/unified-system
          persist-credentials: false
      - name: Checkout pinned pure Meta research dependency
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        env:
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
          GIT_CONFIG_KEY_1: core.eol
          GIT_CONFIG_VALUE_1: lf
        with:
          repository: YehorBabenko88/meta_analyse
          ref: f3c01a23fa5baaeeeb28eb8e9397e72b5ef4d5a1
          path: .source/meta_analyse
          persist-credentials: false
      - name: Record exact source identity
        run: git show --no-patch --format=fuller HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade 'pip>=26.2.2,<27' 'setuptools>=84.1,<85'
      - run: python -m pip install -e .[dev,postgres]
      - name: Install mandatory CPU ML runtime
        run: python -m pip install 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Run full pytest inventory
        id: pytest
        env:
          UNIFIED_SOURCE_ROOT: ${{ github.workspace }}/.source/unified-system
          STRATTESTER_TEST_UNIFIED_ROOT: ${{ github.workspace }}/.source/unified-system
          GATEWAY_META_SOURCE_ROOT: ${{ github.workspace }}/.source/meta_analyse
          GATEWAY_FIXTURE_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -m pytest -v --junitxml=results/core/pytest.xml
      - name: Annotate bounded pytest failure metadata
        if: always()
        run: python scripts/pytest_diagnostics.py results/core/pytest.xml
      - name: Retain full JUnit inventory
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: core-pytest-${{ matrix.os }}-${{ matrix.python }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: results/core/pytest.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Parse PowerShell scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) {
              $failed = $true
              $errors | ForEach-Object {
                Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)"
              }
            }
          }
          if ($failed) { exit 1 }

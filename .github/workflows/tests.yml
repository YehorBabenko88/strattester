name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  SOURCE_DATE_EPOCH: "315532800"
jobs:
  pytest:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11','3.12','3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: YehorBabenko88/math
          ref: a5868944bf1bae813403a32b22d329c1da6f8238
          path: .source/math
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Materialize build inputs from exact Git blobs
        shell: python
        run: |
          import pathlib, runpy
          materialize = runpy.run_path('scripts/materialize_ci_sources.py')['materialize']
          materialize(pathlib.Path.cwd(), '${{ github.event.pull_request.head.sha || github.sha }}', ['market_data'])
          materialize(pathlib.Path('.source/math'), 'a5868944bf1bae813403a32b22d329c1da6f8238', ['python'])
      - run: python -m pip install --no-deps ./.source/math
      - run: python -m pip install ".[test]"
      - run: python -m pytest -v
      - name: Parse PowerShell scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) {
              $failed = $true
              $errors | ForEach-Object {
                Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)"
              }
            }
          }
          if ($failed) { exit 1 }
  frozen-results:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: YehorBabenko88/Terminan
          ref: 75a906d36574bfdc19acd966e79a6c168dc71ad4
          path: .source/terminan
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: YehorBabenko88/math
          ref: a5868944bf1bae813403a32b22d329c1da6f8238
          path: .source/math
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Materialize build inputs from exact Git blobs
        shell: python
        run: |
          import pathlib, runpy
          materialize = runpy.run_path('scripts/materialize_ci_sources.py')['materialize']
          materialize(pathlib.Path.cwd(), '${{ github.event.pull_request.head.sha || github.sha }}', ['market_data'])
          materialize(pathlib.Path('.source/math'), 'a5868944bf1bae813403a32b22d329c1da6f8238', ['python'])
      - run: python -m pip install --no-deps ./.source/math
      - run: python -m pip install ".[test]"
      - name: Materialize canonical historical reader
        shell: python
        run: |
          import pathlib, runpy
          runpy.run_path('scripts/materialize_ci_sources.py')['materialize'](pathlib.Path('.source/terminan'), '75a906d36574bfdc19acd966e79a6c168dc71ad4', ['terminan'])
      - run: python -I scripts/build_sdk_source_manifest.py .source/terminan .source/math .ci-evidence/sdk-source-manifest.json
      - run: python -m pip install --no-deps ./.source/terminan
      - run: python -I scripts/check_sdk_origin_controls.py
      - run: python -I scripts/check_test_roster_controls.py
      - run: python -I scripts/check_frozen_consumer.py

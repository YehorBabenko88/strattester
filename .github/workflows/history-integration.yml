name: history-integration
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Fetch immutable producer references
        run: python scripts/fetch_history_references.py
      - name: Exact-head synthetic checks
        run: python scripts/history_ci.py tests/research 'test_*history*.py'
        env:
          GRID_REFERENCE: ${{ github.workspace }}/.history-evidence/timed-v11/grid
          MATH_REFERENCE: ${{ github.workspace }}/.history-evidence/timed-v11/math
          TERMINAN_REFERENCE: ${{ github.workspace }}/.history-evidence/timed-v11/terminan
          HISTORY_EVIDENCE_ROOT: ${{ github.workspace }}/.history-evidence
          HISTORY_REQUIRE_CROSSREPO: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: history-${{ runner.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            .history-evidence/*.json
            .history-evidence/terminan-review.html
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: history-log-${{ runner.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: .history-evidence/tests.log
          include-hidden-files: true
          if-no-files-found: error

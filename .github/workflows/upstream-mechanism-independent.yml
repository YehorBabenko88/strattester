name: upstream-mechanism-independent
on:
  pull_request:
    paths:
      - 'research/upstream_mechanism_reference.py'
      - 'tests/research/test_upstream_*.py'
      - '.github/workflows/upstream-mechanism-independent.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  differential-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: ''
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU PyTorch and pytest
        run: |
          python -m pip install 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest pytest-json-report
      - name: Mandatory independent differential tests
        run: |
          python -m pytest -q -o addopts='' --strict-markers \
            tests/research/test_upstream_mechanism_differential.py \
            tests/research/test_upstream_structural_adversarial.py \
            --json-report --json-report-file=upstream-pytest.json
      - name: Fail closed on missing tests, skips or errors
        run: |
          python -c "import json; d=json.load(open('upstream-pytest.json')); s=d['summary']; assert s.get('passed',0)>=10 and not any(s.get(k,0) for k in ('failed','error','skipped','xfailed','xpassed')); assert s['total']==s['passed']; required={'test_upstream_mechanism_differential.py','test_upstream_structural_adversarial.py'}; assert required.issubset({t['nodeid'].split('/')[-1].split('::')[0] for t in d['tests'] if t.get('outcome')=='passed'})"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-independent-pytest
          path: upstream-pytest.json
          if-no-files-found: error
